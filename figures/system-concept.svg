<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Earlier single-guide concept</title>
  <desc id="desc">Earlier one-mover guide sketch. Paths and reaction arrows are illustrative; this is not the current four-path layout.</desc>
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f77b4"/>
      <stop offset="0.5" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#e85d75"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#b9c2cc"/>
      <stop offset="1" stop-color="#3c4652"/>
    </radialGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1273de"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e87524"/>
    </marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="60" y="65" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Earlier single-guide concept</text>
  <text x="60" y="98" font-family="Arial, sans-serif" font-size="17" fill="#5c6678">Illustrative path and reaction arrows; attainable control authority is unverified.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="130" width="760" height="470" rx="34" fill="#ffffff" stroke="#d9e0ea" stroke-width="2"/>
  </g>
  <text x="83" y="168" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#33415c">Mobile body and spatial guide</text>

  <path d="M155 370 C230 205, 430 205, 465 355 C500 510, 695 505, 750 350 C695 195, 500 200, 465 355 C430 510, 230 515, 155 370"
        fill="none" stroke="#c9d2df" stroke-width="34" stroke-linecap="round"/>
  <path d="M155 370 C230 205, 430 205, 465 355 C500 510, 695 505, 750 350 C695 195, 500 200, 465 355 C430 510, 230 515, 155 370"
        fill="none" stroke="url(#track)" stroke-width="14" stroke-linecap="round"/>

  <path d="M412 330 C440 300, 480 298, 515 325" fill="none" stroke="#ffffff" stroke-width="38" stroke-linecap="round"/>
  <path d="M412 330 C440 300, 480 298, 515 325" fill="none" stroke="#7b61ff" stroke-width="14" stroke-linecap="round"/>
  <path d="M412 392 C440 420, 480 420, 515 390" fill="none" stroke="#c9d2df" stroke-width="34" stroke-linecap="round" opacity="0.82"/>
  <path d="M412 392 C440 420, 480 420, 515 390" fill="none" stroke="#5470c6" stroke-width="14" stroke-linecap="round" opacity="0.9"/>

  <g fill="#f1ad3d" stroke="#9a5c00" stroke-width="2">
    <rect x="202" y="242" width="30" height="62" rx="8" transform="rotate(-35 217 273)"/>
    <rect x="320" y="220" width="30" height="62" rx="8" transform="rotate(12 335 251)"/>
    <rect x="565" y="224" width="30" height="62" rx="8" transform="rotate(-10 580 255)"/>
    <rect x="687" y="270" width="30" height="62" rx="8" transform="rotate(35 702 301)"/>
    <rect x="674" y="435" width="30" height="62" rx="8" transform="rotate(-38 689 466)"/>
    <rect x="555" y="472" width="30" height="62" rx="8" transform="rotate(10 570 503)"/>
    <rect x="312" y="470" width="30" height="62" rx="8" transform="rotate(-12 327 501)"/>
    <rect x="192" y="425" width="30" height="62" rx="8" transform="rotate(38 207 456)"/>
  </g>

  <circle cx="608" cy="469" r="31" fill="url(#ball)" stroke="#242d38" stroke-width="3"/>
  <circle cx="598" cy="459" r="7" fill="#ffffff" opacity="0.75"/>
  <text x="630" y="518" font-family="Arial, sans-serif" font-size="15" fill="#465266">free reaction-mass mover</text>

  <line x1="610" y1="430" x2="684" y2="378" stroke="#1273de" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="648" y="397" font-family="Arial, sans-serif" font-size="15" fill="#1273de">tangential impulse</text>
  <line x1="604" y1="498" x2="603" y2="566" stroke="#e87524" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <text x="615" y="557" font-family="Arial, sans-serif" font-size="15" fill="#c45f1b">curvature / vertical reaction</text>

  <line x1="465" y1="286" x2="465" y2="236" stroke="#e87524" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <line x1="465" y1="420" x2="465" y2="468" stroke="#1273de" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="405" y="206" font-family="Arial, sans-serif" font-size="14" fill="#5a6474">vertically separated crossing</text>

  <g filter="url(#shadow)">
    <rect x="855" y="130" width="290" height="470" rx="30" fill="#ffffff" stroke="#d9e0ea" stroke-width="2"/>
  </g>
  <text x="885" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#33415c">Closed-loop control</text>

  <rect x="885" y="205" width="230" height="62" rx="14" fill="#edf4ff" stroke="#89afe8"/>
  <text x="1000" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#255a9b">Mover phase sensors</text>
  <text x="1000" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#536177">position + speed</text>

  <rect x="885" y="298" width="230" height="72" rx="14" fill="#f2efff" stroke="#9d8ce3"/>
  <text x="1000" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5b47ae">Phase-response map</text>
  <text x="1000" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#536177">action -> dx, dy, rotation</text>

  <rect x="885" y="402" width="230" height="62" rx="14" fill="#fff3e8" stroke="#e6a36c"/>
  <text x="1000" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#a85518">Coil pulse scheduler</text>
  <text x="1000" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#536177">accelerate / coast / brake</text>

  <rect x="885" y="496" width="230" height="62" rx="14" fill="#eaf8f0" stroke="#73b78f"/>
  <text x="1000" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#25744a">Body localization</text>
  <text x="1000" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#536177">IMU + optical flow + home</text>

  <g stroke="#69778e" stroke-width="3" fill="none" marker-end="url(#arrowBlue)">
    <line x1="1000" y1="267" x2="1000" y2="294"/>
    <line x1="1000" y1="370" x2="1000" y2="398"/>
    <line x1="1000" y1="464" x2="1000" y2="492"/>
  </g>

  <text x="60" y="654" font-family="Arial, sans-serif" font-size="15" fill="#5c6678">Internal actuation cannot change the isolated total centre-of-mass trajectory.</text>
</svg>


