<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Earlier one-mover testbed concept</title>
  <desc id="desc">Conceptual one-mover testbed. This drawing does not depict the current four-path proposal or validated performance.</desc>
  <defs>
    <linearGradient id="guide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#296fd1"/><stop offset="1" stop-color="#7857d8"/></linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset="0.38" stop-color="#bfc8d2"/><stop offset="1" stop-color="#36404c"/></radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#286cc3"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f9fc"/>
  <text x="55" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172033">Earlier one-mover testbed concept</text>
  <text x="55" y="90" font-family="Arial, sans-serif" font-size="16" fill="#5c6678">Unvalidated component testbed; not the current four-path arrangement.</text>
  <g filter="url(#shadow)"><rect x="50" y="125" width="680" height="480" rx="32" fill="#fff" stroke="#d9e0ea" stroke-width="2"/></g>
  <text x="80" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#33415c">Closed-path tubular linear motor</text>
  <ellipse cx="365" cy="356" rx="230" ry="145" fill="none" stroke="#d3dbe6" stroke-width="42"/>
  <ellipse cx="365" cy="356" rx="230" ry="145" fill="none" stroke="url(#guide)" stroke-width="15"/>
  <g fill="#f1ad3d" stroke="#9a5c00" stroke-width="2">
    <rect x="338" y="194" width="54" height="30" rx="7"/><rect x="542" y="263" width="54" height="30" rx="7" transform="rotate(49 569 278)"/>
    <rect x="542" y="418" width="54" height="30" rx="7" transform="rotate(-49 569 433)"/><rect x="338" y="488" width="54" height="30" rx="7"/>
    <rect x="134" y="418" width="54" height="30" rx="7" transform="rotate(49 161 433)"/><rect x="134" y="263" width="54" height="30" rx="7" transform="rotate(-49 161 278)"/>
  </g>
  <circle cx="526" cy="459" r="29" fill="url(#ball)" stroke="#242d38" stroke-width="3"/>
  <path d="M502 438 C460 396 437 363 420 317" fill="none" stroke="#286cc3" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="436" y="389" font-family="Arial, sans-serif" font-size="14" fill="#286cc3">travelling field</text>
  <text x="80" y="555" font-family="Arial, sans-serif" font-size="15" fill="#465266">one free magnetic or ferromagnetic mover</text>
  <text x="80" y="580" font-family="Arial, sans-serif" font-size="14" fill="#5c6678">Planar circulation testbed; schematic only.</text>
  <g filter="url(#shadow)"><rect x="775" y="125" width="375" height="480" rx="32" fill="#fff" stroke="#d9e0ea" stroke-width="2"/></g>
  <text x="805" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#33415c">Sensing and learned response</text>
  <g font-family="Arial, sans-serif">
    <rect x="810" y="198" width="305" height="58" rx="13" fill="#edf4ff" stroke="#89afe8"/><text x="962" y="223" text-anchor="middle" font-size="15" font-weight="700" fill="#255a9b">Mover phase and speed</text><text x="962" y="243" text-anchor="middle" font-size="13" fill="#536177">magnetic / inductive / optical</text>
    <rect x="810" y="282" width="305" height="70" rx="13" fill="#f2efff" stroke="#9d8ce3"/><text x="962" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#5b47ae">Adaptive response map</text><text x="962" y="330" text-anchor="middle" font-size="13" fill="#536177">action → force, motion, vibration</text>
    <rect x="810" y="378" width="305" height="58" rx="13" fill="#fff3e8" stroke="#e6a36c"/><text x="962" y="403" text-anchor="middle" font-size="15" font-weight="700" fill="#a85518">Coil commutation</text><text x="962" y="423" text-anchor="middle" font-size="13" fill="#536177">accelerate / coast / brake</text>
    <rect x="810" y="462" width="145" height="94" rx="13" fill="#eaf8f0" stroke="#73b78f"/><text x="882" y="489" text-anchor="middle" font-size="14" font-weight="700" fill="#25744a">Target effects</text><text x="882" y="512" text-anchor="middle" font-size="12" fill="#536177">force • torque</text><text x="882" y="532" text-anchor="middle" font-size="12" fill="#536177">vibration • balance</text>
    <rect x="970" y="462" width="145" height="94" rx="13" fill="#f8f1e9" stroke="#c9a16e"/><text x="1042" y="489" text-anchor="middle" font-size="14" font-weight="700" fill="#8b5b20">Extensions</text><text x="1042" y="512" text-anchor="middle" font-size="12" fill="#536177">paired modules</text><text x="1042" y="532" text-anchor="middle" font-size="12" fill="#536177">compliant impulse</text>
  </g>
  <g stroke="#69778e" stroke-width="3" fill="none" marker-end="url(#arrow)"><line x1="962" y1="256" x2="962" y2="278"/><line x1="962" y1="352" x2="962" y2="374"/><line x1="962" y1="436" x2="962" y2="458"/></g>
  <text x="55" y="662" font-family="Arial, sans-serif" font-size="15" fill="#5c6678">No reactionless propulsion: changing total linear momentum requires an external force.</text>
</svg>
